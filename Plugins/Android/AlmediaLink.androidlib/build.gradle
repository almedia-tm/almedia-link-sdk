apply plugin: 'com.android.library'

def unityProp = { String key, fallback ->
    project.hasProperty(key) ? project.property(key) : fallback
}
def compileSdkLevel = unityProp('unity.compileSdkVersion', '34').toString() as int
def buildTools      = unityProp('unity.buildToolsVersion', '34.0.0').toString()

android {
    namespace 'co.almedia.link.androidlib'   // required by AGP 8+; supported since AGP 7.0
    compileSdk compileSdkLevel
    buildToolsVersion buildTools

    defaultConfig {
        minSdk 23
    }

    // This .androidlib is flat (manifest at the folder root, not src/main/), point AGP at it.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'   // pinned: 1.1.0+ breaks D8 on AGP 7.x
}